name: Python Auto Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのコードを取得
      uses: actions/checkout@v4

    - name: Python環境のセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: pytestによる自動テスト実行
      run: |
        cd 40_SC
        pytest
